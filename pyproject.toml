[build-system]
requires = ["scikit-build-core>=0.10.0", "ninja"]
build-backend = "scikit_build_core.build"

[project]
name = "vectorlite_py"
version = "0.3.0"
description = "Fast vector search for sqlite3"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Yefu Wang", email = "1yefuwang1@gmail.com"}
]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://github.com/1yefuwang1/vectorlite"
Repository = "https://github.com/1yefuwang1/vectorlite"

[tool.scikit-build]
# CMake installs Python source and the Cargo artifact together. Do not copy an
# ignored/stale source-tree extension binary into the wheel.
wheel.packages = []
sdist.include = ["scripts/install_rust.sh"]
sdist.exclude = ["build/**", "target/**", "vectorlite/target/**", "**/__pycache__/**", "bindings/python/vectorlite_py/vectorlite.so", "bindings/python/vectorlite_py/vectorlite.dylib", "bindings/python/vectorlite_py/vectorlite.dll"]
# Minimum version of CMake
cmake.version = ">=3.22"
# Build configuration
cmake.build-type = "Release"
# Use Ninja generator and vcpkg toolchain
cmake.args = [
    "-G", "Ninja",
    "-DCMAKE_TOOLCHAIN_FILE=vcpkg/scripts/buildsystems/vcpkg.cmake"
]
# Set wheel platform tags (py3-none-{platform})
wheel.py-api = "py3"

[tool.scikit-build.cmake.define]
# These will be passed to CMake as -D flags
SKBUILD = "1"
CMAKE_BUILD_TYPE = "Release"
BUILD_TESTING = "OFF"
VECTORLITE_BUILD_BENCHMARKS = "OFF"
VECTORLITE_DEPLOY_TO_PYTHON = "OFF"

[tool.cibuildwheel]
# cibuildwheel only builds wheels here. The prebuilt CPython interpreters that
# cibuildwheel uses (manylinux/macOS/Windows) ship a `sqlite3` module compiled
# without loadable-extension support, so they cannot load the vectorlite
# extension. The built wheels are instead tested in CI with a uv-managed
# CPython 3.14, whose `sqlite3` has loadable extensions enabled and bundles a
# recent SQLite (>= 3.38).
skip = ["*-win32", "*-win_arm64", "*-manylinux_i686", "*musllinux*", "pp*", "cp39*", "cp310*", "cp311*", "cp312*", "cp313*"]

[tool.cibuildwheel.macos]
environment = {MACOSX_DEPLOYMENT_TARGET = "10.15"}

[[tool.cibuildwheel.overrides]]
select = "*-macosx_arm64"
environment = {MACOSX_DEPLOYMENT_TARGET = "11.0"}

# Rust must be installed inside the manylinux container, not only on the host.
[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
before-all = "sh {project}/scripts/install_rust.sh"
environment = { CARGO_HOME = "/opt/rust/cargo", RUSTUP_HOME = "/opt/rust/rustup", RUSTUP_TOOLCHAIN = "stable", PATH = "/opt/rust/cargo/bin:$PATH", VCPKG_DEFAULT_BINARY_CACHE = "/project/vcpkg-binary-cache" }